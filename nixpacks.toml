# Override Nixpacks' default install phase, which uses `npm ci`.
# `npm ci` is strict and fails when the committed package-lock.json was
# generated by a different npm version than the build's (Node 20 here),
# because npm places the @emnapi optional peer deps differently across
# versions. `npm install` reconciles the lock instead of failing.
[phases.install]
cmds = ["npm install"]
