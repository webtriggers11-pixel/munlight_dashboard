<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <style>
    /* Near-black tile in light browser chrome, inverted in dark chrome, so the
       mark never disappears into the tab bar. */
    .tile  { fill: #1a1b22; }
    .glyph { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile  { fill: #ffffff; }
      .glyph { fill: #1a1b22; }
    }
  </style>
  <rect class="tile" width="48" height="48" rx="10" />
  <g class="glyph">
    <rect x="8"  y="8"  width="14" height="14" rx="3" />
    <rect x="26" y="8"  width="14" height="14" rx="3" />
    <rect x="8"  y="26" width="14" height="14" rx="3" />
    <rect x="26" y="26" width="14" height="14" rx="3" />
  </g>
</svg>
