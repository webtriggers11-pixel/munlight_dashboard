server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router-dom needs every unknown path to resolve to
    # index.html so client-side routing can take over, otherwise refreshing
    # any non-root route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
